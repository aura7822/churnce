name: churnce

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: churnce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-churnce_dev_password}
      POSTGRES_DB: churnce
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schemas/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churnce -d churnce"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://churnce:${POSTGRES_PASSWORD:-churnce_dev_password}@db:5432/churnce
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 4s
      retries: 10
    ports:
      - "8000:8000"

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  demo-site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./demo-site:/usr/share/nginx/html:ro
      - ./demo-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

volumes:
  pgdata:
